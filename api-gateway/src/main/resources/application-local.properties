spring.application.name=api-gateway
server.port=8080

# ===================================================================
# RUTAS HACIA LOS MICROSERVICIOS
# ===================================================================

# ms-juegos (Puerto 8081)
# Cliente llama: GET http://localhost:8080/juegos/api/juegos
# Gateway redirige a: GET http://localhost:8081/api/juegos
spring.cloud.gateway.routes[0].id=ms-juegos
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/juegos/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/juegos/(?<segment>.*), /${segment}

# ms-usuarios (Puerto 8082)
# Cliente llama: GET http://localhost:8080/usuarios/api/usuarios
# Gateway redirige a: GET http://localhost:8082/api/usuarios
spring.cloud.gateway.routes[1].id=ms-usuarios
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/usuarios/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/usuarios/(?<segment>.*), /${segment}

# ms-pedidos (Puerto 8083)
# Cliente llama: GET http://localhost:8080/pedidos/api/pedidos
# Gateway redirige a: GET http://localhost:8083/api/pedidos
spring.cloud.gateway.routes[2].id=ms-pedidos
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/pedidos/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/pedidos/(?<segment>.*), /${segment}

# ===================================================================
# LOGS PARA VER LAS RUTAS EN ACCION
# ===================================================================
logging.level.org.springframework.cloud.gateway=DEBUG
